<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change a point color</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
        font-family: Arial, sans-serif;
      }
      
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      
      canvas {
        display: block;
        opacity: 0;
        animation: fadeIn 0.64s ease-in forwards;
        animation-delay: 0.08s;
      }
      
      #numdot {
        text-align: center;
        margin: 10px 0;
        opacity: 0;
        animation: fadeIn 0.64s ease-in forwards;
        animation-delay: 0.24s;
      }
      
      .button-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        opacity: 0;
        animation: fadeIn 0.64s ease-in forwards;
      }
      
      .button-group:nth-of-type(1) {
        animation-delay: 0.4s;
      }
      
      .button-group:nth-of-type(2) {
        animation-delay: 0.56s;
      }
      
      .button-group:nth-of-type(3) {
        animation-delay: 0.72s;
      }
      
      button {
        width: 120px;
        padding: 8px;
      }
      
      .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 300px;
        opacity: 0;
        animation: fadeIn 0.64s ease-in forwards;
      }
      
      .slider-container:nth-child(6) {
        animation-delay: 0.88s;
      }
      
      .slider-container:nth-child(7) {
        animation-delay: 1.04s;
      }
      
      .slider-container:nth-child(8) {
        animation-delay: 1.2s;
      }
      
      .slider-container:nth-child(9) {
        animation-delay: 1.36s;
      }
      
      .slider-container:nth-child(10) {
        animation-delay: 1.52s;
      }
      
      .slider-container label {
        display: inline-block;
        width: 70px;
        text-align: right;
        vertical-align: middle;
      }
      
      .slider-container input[type="range"] {
        flex: 1;
        vertical-align: middle;
      }
      
      #funny-gif {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 1000;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <canvas id="webgl" width="400" height="400">
        Please use a browser that supports "canvas"
      </canvas>
      
      <p id="numdot"> XXX </p>
      <p id="instructions" style="text-align: center; margin: 5px 0; opacity: 0; animation: fadeIn 0.64s ease-in forwards; animation-delay: 0.24s;">drag on canvas to rotate the sheep. shift + click for it's animation.</p>

      <div style="display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 10px;">
        <label>walk animation:</label>
        <button type="button" id="walkOnButton" style="width: 50px; padding: 4px; font-size: 12px;">ON</button>
        <button type="button" id="walkOffButton" style="width: 50px; padding: 4px; font-size: 12px;">OFF</button>
      </div>

      <div class="slider-container">
        <label>rotation x</label>
        <input type="range" min="0" max="90" value="5" class="slider" id="AngleSlide">
      </div>

      <div class="slider-container">
        <label>rotation y</label>
        <input type="range" min="-45" max="45" value="-20" class="slider" id="sheepTiltSlide">
      </div>

      <div class="slider-container">
        <label>tail angle</label>
        <input type="range" min="-45" max="45" value="0" class="slider" id="tailSlide">
      </div>

      <div class="slider-container">
        <label>thigh angle</label>
        <input type="range" min="-60" max="60" value="0" class="slider" id="thighSlide">
      </div>

      <div class="slider-container">
        <label>calf angle</label>
        <input type="range" min="-60" max="60" value="0" class="slider" id="calfSlide">
      </div>

    </div>

    <img id="funny-gif" src="lib/funny.gif" alt="Funny GIF">

    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix.js"></script>
    <script src="Point.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script>
    <script src="Cube.js"></script>
    <script src="Cylinder.js"></script>
    <script src="BlockyAnimal.js"></script>
    
    <script>
      // Call main after all scripts are loaded
      main();
    </script>
  </body>
</html>
